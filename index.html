<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner: Escape the Monster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw; 
            height: 100vh; 
            background-color: #e0e0e0;
        }
        canvas {
            display: block;
            width: 100%;   
            height: 100%;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
        
        .img-btn {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .img-btn:hover {
            transform: scale(1.05);
        }
        .img-btn:active {
            transform: scale(0.95);
        }

        #start-screen {
            background-image: url('assets/ui-bg-start.png');
            justify-content: flex-start;
            padding-top: 40px;
            background-color: #2c3e50;
        }
        #start-screen.active {
            background-image: url('assets/ui-bg-start.png'); 
            background-repeat: no-repeat; 
            background-size: 100% 100%; 
            background-position: center; 
            background-color: #2c3e50;
        }
        #btn-mute-start {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px; height: 50px;
        }
        #ui-logo { 
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px; 
            height: auto;
        }
        #btn-play { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; 
            height: auto; 
            z-index: 10;
        }
        #ui-howto { 
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px; 
            height: 50px; 
        }

        #game-ui {
            pointer-events: none;
        }
        #game-ui .img-btn { pointer-events: auto; }
        
        #top-left-ui {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        #coin-board-container {
            position: relative;
            width: 150px;
            height: 50px;
        }
        #ui-frame-coin {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        #coin-val {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; color: white;
            text-shadow: 1px 1px 3px black;
        }

        #btn-pause {
            position: absolute;
            top: 15px; right: 20px;
            width: 50px; height: 50px;
        }

        #escape-status {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            color: #e74c3c; font-size: 18px; font-weight: bold;
            background: rgba(255, 255, 255, 0.9); padding: 5px 15px; border-radius: 5px;
            display: none; border: 2px solid #e74c3c;
        }

        .popup-screen {
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .popup-box {
            position: relative;
            width: 400px; height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .popup-bg-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
        
        .pause-buttons { display: flex; gap: 20px; margin-top: 20px; }
        .pause-buttons img { width: 60px; height: 60px; }

        .gameover-stats {
            font-size: 32px; font-weight: bold; color: white; text-shadow: 2px 2px 4px black;
            margin-bottom: 30px; text-align: center;
        }
        .gameover-buttons { display: flex; gap: 30px; }
        .gameover-buttons img { width: 80px; height: 80px; }

        #countdown-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            z-index: 100;
            pointer-events: none;
        }
        #countdown-text {
            font-size: 120px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8), 0 0 20px #e67e22;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1050" height="450"></canvas>
    
    <div id="start-screen" class="screen active">
        <img src="assets/ui-mute.png" id="btn-mute-start" class="img-btn" alt="Mute">
        <img src="assets/ui-logo.png" id="ui-logo" alt="Game Logo">
        <img src="assets/ui-play.png" id="btn-play" class="img-btn" alt="Play Button">
        <img src="assets/ui-howto.png" id="ui-howto" alt="How to Play">
    </div>

    <div id="game-ui" class="screen">
        <div id="top-left-ui">
            <!-- เอาบอร์ดหัวใจออก โชว์เฉพาะเหรียญ -->
            <div id="coin-board-container">
                <img src="assets/ui-frame-coin.png" id="ui-frame-coin" alt="Coin Frame">
                <div id="coin-val">0</div>
            </div>
        </div>
        
        <img src="assets/ui-pause.png" id="btn-pause" class="img-btn" alt="Pause">
        <div id="escape-status">หนี! เก็บเหรียญ: <span id="escape-coins-val">0</span>/10</div>
    </div>

    <div id="pause-screen" class="screen popup-screen">
        <div class="popup-box">
            <img src="assets/ui-frame-pause.png" class="popup-bg-frame" alt="Pause Frame">
            <h2 style="color:white; font-size:36px; margin: 0; text-shadow: 2px 2px 4px black;">PAUSED</h2>
            <div class="pause-buttons">
                <img src="assets/ui-home.png" id="btn-home-pause" class="img-btn" alt="Home">
                <img src="assets/ui-resume.png" id="btn-resume" class="img-btn" alt="Resume">
                <img src="ui-mute.png" id="btn-mute-pause" class="img-btn" alt="Mute">
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="screen popup-screen">
        <div class="popup-box">
            <img src="assets/ui-frame-gameover.png" class="popup-bg-frame" alt="Game Over Frame">
            <div class="gameover-stats">
                <div id="game-over-title" style="font-size: 20px; color: #ff9f43; margin-bottom: 10px;">GAME OVER</div>
                เหรียญทั้งหมด: <br><span id="final-coins" style="font-size: 48px; color: #f1c40f;">0</span>
            </div>
            <div class="gameover-buttons">
                <img src="assets/ui-home.png" id="btn-home-over" class="img-btn" alt="Home">
                <img src="assets/ui-refresh.png" id="btn-restart" class="img-btn" alt="Refresh">
            </div>
        </div>
    </div>

    <div id="countdown-overlay">
        <div id="countdown-text">3</div>
    </div>
</div>

<script>
    const IMAGE_PATHS = {
        // --- รูปตัวละคร (4 ท่าทาง) ---
        playerRun1: 'assets/player-run1.png',   // วิ่งจังหวะที่ 1
        playerRun2: 'assets/player-run2.png',   // วิ่งจังหวะที่ 2
        playerJump: 'assets/player-jump.png',   // กระโดด
        playerDuck: 'assets/player-duck.png',   // หมอบ
        
        monster: 'assets/monster.png',
        coin: 'assets/coin.png',
        obstacle: 'assets/obstacle.png',
        background: 'assets/background.png',
        obstacleFlying: 'assets/obstacle-flying.png',
        itemSpeed: 'assets/item-speed.png',
        itemInvincible: 'assets/item-invincible.png',
        
        btnPlay: 'assets/ui-play.png', btnPause: 'assets/ui-pause.png', btnResume: 'assets/ui-resume.png',
        btnHome: 'assets/ui-home.png', btnRefresh: 'assets/ui-refresh.png', btnMute: 'assets/ui-mute.png',
        logo: 'assets/ui-logo.png', howto: 'assets/ui-howto.png',
        frameCoin: 'assets/ui-frame-coin.png', framePause: 'assets/ui-frame-pause.png', frameGameOver: 'assets/ui-frame-gameover.png'
    };

    const images = {};
    for (let key in IMAGE_PATHS) {
        // อัปเดตรายชื่อคีย์ที่ต้องวาดลง Canvas ให้ครอบคลุมรูป player ทั้ง 4 แบบ
        if (['playerRun1', 'playerRun2', 'playerJump', 'playerDuck', 'monster', 'coin', 'obstacle', 'background', 'obstacleFlying', 'itemSpeed', 'itemInvincible'].includes(key)) {
            images[key] = new Image();
            images[key].onerror = () => console.warn(`หาไฟล์ภาพ "${IMAGE_PATHS[key]}" ไม่พบ`);
            images[key].src = IMAGE_PATHS[key];
        }
    }

    function drawSprite(ctx, imgKey, fallbackDraw) {
        const img = images[imgKey];
        if (img && img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, this.x, this.y, this.width, this.height);
        } else {
            fallbackDraw(ctx, this);
        }
    }

    const screens = {
        start: document.getElementById('start-screen'),
        game: document.getElementById('game-ui'),
        pause: document.getElementById('pause-screen'),
        gameOver: document.getElementById('game-over-screen')
    };

    function showScreen(screenName) {
        for (let key in screens) screens[key].classList.remove('active');
        if (screens[screenName]) screens[screenName].classList.add('active');
    }

    let gameState = 'START';
    let isMuted = false;

    document.getElementById('btn-play').addEventListener('click', () => { initGame(); });
    document.getElementById('btn-mute-start').addEventListener('click', toggleMute);
    document.getElementById('btn-pause').addEventListener('click', () => { if (gameState === 'PLAYING') pauseGame(); });
    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-home-pause').addEventListener('click', goHome);
    document.getElementById('btn-mute-pause').addEventListener('click', toggleMute);
    document.getElementById('btn-restart').addEventListener('click', () => { initGame(); });
    document.getElementById('btn-home-over').addEventListener('click', goHome);

    function toggleMute() {
        isMuted = !isMuted;
        alert(isMuted ? "ปิดเสียงแล้ว" : "เปิดเสียงแล้ว");
    }

    function pauseGame() {
        gameState = 'PAUSED';
        screens.pause.classList.add('active');
    }

    function resumeGame() {
        screens.pause.classList.remove('active');
        startCountdown(3, () => {
            gameState = 'PLAYING';
            requestAnimationFrame(loop);
        });
    }

    function startCountdown(seconds, callback) {
        gameState = 'COUNTDOWN';
        let count = seconds;
        
        countdownText.innerText = count;
        countdownOverlay.style.display = 'flex';
        countdownText.style.animation = 'none';
        countdownText.offsetHeight;
        countdownText.style.animation = 'popIn 0.3s ease-out';

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countdownText.innerText = count;
                countdownText.style.animation = 'none';
                countdownText.offsetHeight;
                countdownText.style.animation = 'popIn 0.3s ease-out';
            } else if (count === 0) {
                countdownText.innerText = 'GO!';
                countdownText.style.animation = 'none';
                countdownText.offsetHeight;
                countdownText.style.animation = 'popIn 0.3s ease-out';
            } else {
                clearInterval(timer);
                countdownOverlay.style.display = 'none';
                callback();
            }
        }, 800);
    }

    function goHome() {
        gameState = 'START';
        showScreen('start');
        drawBackground();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GROUND_Y = 400;
    
    // ตั้งค่าความเร็วคงที่
    const BASE_SPEED = 5;

    const coinEl = document.getElementById('coin-val');
    const escapeStatusEl = document.getElementById('escape-status');
    const escapeCoinsEl = document.getElementById('escape-coins-val');
    const gameOverTitle = document.getElementById('game-over-title');
    const finalCoinsEl = document.getElementById('final-coins');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownText = document.getElementById('countdown-text');

    let frames, totalCoins, gameSpeed;
    let isMonsterChasing, coinsCollectedToEscape;
    let player, monster, obstacles, coins, items, bgX;
    
    // ตัวแปรสำหรับกะระยะการเกิดเพื่อไม่ให้ซ้อนทับกัน
    let obstacleTimer = 0;
    let coinTimer = 0;
    let itemTimer = 0;

    function initGame() {
        player = new Player();
        monster = new Monster();
        obstacles = [];
        coins = [];
        items = [];
        bgX = 0;
        
        frames = 0;
        totalCoins = 0;
        gameSpeed = BASE_SPEED;
        
        isMonsterChasing = false;
        coinsCollectedToEscape = 0;
        
        // ตั้งเวลาเกิดชิ้นแรกเริ่มที่กี่เฟรม
        obstacleTimer = 100;
        coinTimer = 150;
        itemTimer = 500;
        
        coinEl.innerText = totalCoins;
        updateEscapeUI();
        
        gameState = 'PLAYING';
        showScreen('game');
        
        loop();
    }

    // ฟังก์ชันเช็คว่ามีพื้นที่ว่างพอให้สิ่งของชิ้นใหม่เกิดหรือไม่
    function isSpawnClear(minDistance) {
        let entities = [...obstacles, ...coins, ...items];
        for (let e of entities) {
            // ถ้าระยะขอบขวาของของที่เกิดไปแล้ว ยังอยู่ใกล้ขอบจอขวามากเกินไป -> ยังไม่ให้เกิด
            if (e.x + (e.width || 0) > canvas.width - minDistance) {
                return false;
            }
        }
        return true;
    }

    class Player {
        constructor() {
            this.originalWidth = 50; 
            this.originalHeight = 60;
            this.width = this.originalWidth; 
            this.height = this.originalHeight;
            
            this.x = 150; 
            this.y = GROUND_Y - this.height;
            this.vy = 0; 
            
            this.gravity = 0.4; 
            this.jumpPower = -12.5; 
            this.isGrounded = true; 
            
            this.maxJumps = 2; 
            this.jumpCount = 0;
            this.invulnerableFrames = 0;
            
            this.speedTimer = 0;
            this.invincibleTimer = 0;
            
            // สถานะหมอบ
            this.isDucking = false;
        }

        jump() {
            if (this.jumpCount < this.maxJumps) {
                this.vy = this.jumpPower; 
                this.isGrounded = false; 
                this.jumpCount++;
                
                // ถ้ายืนหมอบอยู่แล้วกดกระโดด ให้ยกเลิกการหมอบทันที
                this.isDucking = false;
                this.height = this.originalHeight;
            }
        }

        duck(isDuckingDown) {
            // จะหมอบได้เฉพาะตอนอยู่บนพื้นเท่านั้น
            if (isDuckingDown && this.isGrounded) {
                this.isDucking = true;
                this.height = this.originalHeight / 2; // ลดความสูง Hitbox ลงครึ่งหนึ่ง
            } else if (!isDuckingDown) {
                this.isDucking = false;
                this.height = this.originalHeight; // คืนค่าความสูงเมื่อปล่อยปุ่ม
            }
        }

        update() {
            this.y += this.vy; 
            this.vy += this.gravity;
            
            // ป้องกันตัวละครจมดิน (คำนวณตามความสูงปัจจุบัน)
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height; 
                this.vy = 0; 
                this.isGrounded = true; 
                this.jumpCount = 0;
            }
            
            if (this.invulnerableFrames > 0) this.invulnerableFrames--;
            if (this.speedTimer > 0) this.speedTimer--;
            if (this.invincibleTimer > 0) this.invincibleTimer--;
        }

        draw() {
            if (this.invulnerableFrames > 0 && Math.floor(this.invulnerableFrames / 5) % 2 === 0) return; 
            
            ctx.save();
            if (this.invincibleTimer > 0) {
                ctx.globalAlpha = 0.7; ctx.shadowColor = "gold"; ctx.shadowBlur = 15;
            } else if (this.speedTimer > 0) {
                ctx.shadowColor = "cyan"; ctx.shadowBlur = 15;
            }

            // --- เลือกว่าจะวาดรูปไหนตามสถานะตัวละคร ---
            let currentImg = 'playerRun1'; // ค่าเริ่มต้น
            
            if (!this.isGrounded) {
                // ถ้าตัวลอยอยู่ = กระโดด
                currentImg = 'playerJump';
            } else if (this.isDucking) {
                // ถ้ากดลงค้างไว้ = หมอบ
                currentImg = 'playerDuck';
            } else {
                // ถ้ายืนบนพื้นปกติ ให้สลับรูปวิ่ง 1 และ 2 ทุกๆ 10 เฟรม (เพิ่ม/ลดเลข 10 เพื่อปรับความเร็วสับขา)
                if (Math.floor(frames / 10) % 2 === 0) {
                    currentImg = 'playerRun1';
                } else {
                    currentImg = 'playerRun2';
                }
            }

            // วาดรูปตามตัวแปร currentImg
            drawSprite.call(this, ctx, currentImg, (ctx, obj) => { 
                ctx.fillStyle = this.isDucking ? '#2980b9' : '#3498db'; 
                ctx.fillRect(obj.x, obj.y, obj.width, obj.height); 
            });
            
            ctx.restore();
        }
    }

    class Monster {
        constructor() {
            this.width = 90; this.height = 100;
            this.y = GROUND_Y - this.height; this.x = -150; this.targetX = -150; 
        }
        update() {
            this.targetX = isMonsterChasing ? 10 : -150;
            if (gameState === 'GAMEOVER' && isMonsterChasing) this.targetX = player.x;
            this.x += (this.targetX - this.x) * 0.05;
        }
        draw() {
            drawSprite.call(this, ctx, 'monster', (ctx, obj) => {
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                ctx.fillStyle = 'black'; ctx.fillRect(obj.x + 60, obj.y + 20, 10, 10);
            });
        }
    }

    class Obstacle {
        constructor() { this.width = 40; this.height = 50; this.x = canvas.width; this.y = GROUND_Y - this.height; }
        update() { this.x -= gameSpeed; }
        draw() { drawSprite.call(this, ctx, 'obstacle', (ctx, obj) => { ctx.fillStyle = '#e67e22'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); }); }
    }

    class FlyingObstacle {
        constructor() { 
            this.width = 45; this.height = 35; 
            this.x = canvas.width; 
            this.y = GROUND_Y - 100 - Math.random() * 40; 
        }
        update() { this.x -= gameSpeed; }
        draw() { drawSprite.call(this, ctx, 'obstacleFlying', (ctx, obj) => { ctx.fillStyle = '#8e44ad'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); }); }
    }

    class Coin {
        constructor(x, y) { 
            this.width = 30; this.height = 30; 
            this.x = x || canvas.width; 
            this.y = y || (GROUND_Y - 120 - Math.random() * 60); 
            this.isCollected = false; 
        }
        update() { this.x -= gameSpeed; }
        draw() {
            if (this.isCollected) return;
            drawSprite.call(this, ctx, 'coin', (ctx, obj) => { ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2); ctx.fill(); });
        }
    }

    class Item {
        constructor(type) {
            this.type = type; 
            this.width = 40; this.height = 40;
            this.x = canvas.width;
            this.y = GROUND_Y - 90 - Math.random() * 40;
            this.isCollected = false;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            if (this.isCollected) return;
            let imgKey = this.type === 'speed' ? 'itemSpeed' : 'itemInvincible';
            drawSprite.call(this, ctx, imgKey, (ctx, obj) => { 
                ctx.fillStyle = this.type === 'speed' ? 'cyan' : 'gold'; 
                ctx.beginPath(); ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2); ctx.fill(); 
            });
        }
    }

    function updateEscapeUI() {
        if (isMonsterChasing) {
            escapeStatusEl.style.display = 'block';
            escapeCoinsEl.innerText = coinsCollectedToEscape;
        } else {
            escapeStatusEl.style.display = 'none';
        }
    }

    // --- ระบบควบคุมใหม่ รองรับ กดลง เพื่อหมอบ ---
    function handleKeyDown(e) {
        if (gameState !== 'PLAYING') return;
        // กด Spacebar หรือ ลูกศรขึ้น เพื่อกระโดด
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            player.jump();
        }
        // กด ลูกศรลง เพื่อหมอบ
        if (e.code === 'ArrowDown') {
            player.duck(true);
        }
    }
    function handleKeyUp(e) {
        if (gameState !== 'PLAYING') return;
        // เมื่อปล่อยปุ่มลูกศรลง ให้เลิกหมอบ
        if (e.code === 'ArrowDown') {
            player.duck(false);
        }
    }
    // ลบ event 'keydown' เดิมออก แล้วใส่ 2 ตัวนี้แทน
    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    canvas.addEventListener('mousedown', () => { if (gameState === 'PLAYING') player.jump(); });

    function checkCollision(rect1, rect2) {
        return (rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y);
    }

    function handleObstacles() {
        // ใช้ Timer ควบคู่กับตัวเช็คระยะห่าง 250px เพื่อกันเกิดซ้อนทับกัน
        if (obstacleTimer <= 0 && isSpawnClear(250)) {
            if (Math.random() > 0.3) obstacles.push(new Obstacle());
            else obstacles.push(new FlyingObstacle());
            
            // ตั้งเวลาเกิดชิ้นต่อไปแบบสุ่ม
            obstacleTimer = 100 + Math.floor(Math.random() * 60);
        }

        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i]; obs.update(); obs.draw();
            let pBox = { x: player.x + 10, y: player.y + 10, width: player.width - 20, height: player.height - 10 };
            let oBox = { x: obs.x + 5, y: obs.y + 5, width: obs.width - 10, height: obs.height - 10 };

            if (checkCollision(pBox, oBox) && player.invulnerableFrames <= 0) {
                if (player.invincibleTimer > 0) {
                    // หากมีบัฟอมตะ ปล่อยทะลุ ไม่เสียพลัง
                } else {
                    player.invulnerableFrames = 60; // อมตะ 1 วินาทีหลังชน
                    
                    if (isMonsterChasing) {
                        doGameOver("ถูกมอนสเตอร์จับตัวได้!"); // หากมอนสเตอร์ตามอยู่และชนซ้ำ = ตาย
                    } else { 
                        isMonsterChasing = true; 
                        coinsCollectedToEscape = 0; 
                        updateEscapeUI(); 
                    }
                }
            }
            if (obs.x + obs.width < 0) { obstacles.splice(i, 1); i--; }
        }
    }

    function handleCoins() {
        // เช็คให้เว้นระยะจากสิ่งอื่นๆ อย่างน้อย 300px ค่อยปล่อยเหรียญชุดต่อไป
        if (coinTimer <= 0 && isSpawnClear(300)) {
            let pattern = Math.random();
            let startY = GROUND_Y - 100 - Math.random() * 50;
            
            if (pattern < 0.3) {
                coins.push(new Coin(canvas.width, startY));
            } else if (pattern < 0.6) {
                coins.push(new Coin(canvas.width, startY));
                coins.push(new Coin(canvas.width + 40, startY));
                coins.push(new Coin(canvas.width + 80, startY));
            } else {
                coins.push(new Coin(canvas.width, startY));
                coins.push(new Coin(canvas.width + 40, startY - 30));
                coins.push(new Coin(canvas.width + 80, startY - 60));
                coins.push(new Coin(canvas.width + 120, startY - 30));
                coins.push(new Coin(canvas.width + 160, startY));
            }
            
            coinTimer = 150 + Math.floor(Math.random() * 100);
        }
        
        for (let i = 0; i < coins.length; i++) {
            let coin = coins[i]; coin.update(); coin.draw();
            if (!coin.isCollected && checkCollision(player, coin)) {
                coin.isCollected = true;
                totalCoins++;
                coinEl.innerText = totalCoins;

                if (isMonsterChasing) {
                    coinsCollectedToEscape++; updateEscapeUI();
                    if (coinsCollectedToEscape >= 10) { isMonsterChasing = false; updateEscapeUI(); }
                }
            }
            if (coin.x + coin.width < 0 || coin.isCollected) { coins.splice(i, 1); i--; }
        }
    }

    function handleItems() {
        // เว้นระยะเกิดไอเท็มที่ 300px
        if (itemTimer <= 0 && isSpawnClear(300)) {
            let type = Math.random() > 0.5 ? 'speed' : 'invincible';
            items.push(new Item(type));
            itemTimer = 500 + Math.floor(Math.random() * 200);
        }

        for (let i = 0; i < items.length; i++) {
            let item = items[i]; item.update(); item.draw();
            if (!item.isCollected && checkCollision(player, item)) {
                item.isCollected = true;
                // ตั้งเวลาสถานะพิเศษเป็นเวลา 6 วินาที (360 frames)
                if (item.type === 'speed') player.speedTimer = 360;
                else player.invincibleTimer = 360;
            }
            if (item.x + item.width < 0 || item.isCollected) { items.splice(i, 1); i--; }
        }
    }

    function drawBackground() {
        const bgImg = images['background'];
        if (bgImg && bgImg.complete && bgImg.naturalWidth !== 0) {
            if (gameState === 'PLAYING') bgX -= gameSpeed * 0.5;
            if (bgX <= -canvas.width) bgX = 0;
            ctx.drawImage(bgImg, bgX, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, bgX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        }
    }

    function doGameOver(reason) {
        gameState = 'GAMEOVER';
        gameOverTitle.innerText = reason;
        finalCoinsEl.innerText = totalCoins;
        
        setTimeout(() => {
            screens.gameOver.classList.add('active');
        }, 800); 
    }

    function loop() {
        if (gameState !== 'PLAYING' && gameState !== 'GAMEOVER') return;

        // คำนวณความเร็วเกม: ความเร็วพื้นฐาน + หากมีบัฟความเร็วบวกเพิ่มแค่ +2 ไม่ให้เร็วเกิน
        gameSpeed = BASE_SPEED + (player.speedTimer > 0 ? 2 : 0);
        
        // ลดเวลา timer การเกิดสิ่งต่างๆ
        obstacleTimer--;
        coinTimer--;
        itemTimer--;

        drawBackground();

        if (gameState === 'GAMEOVER') {
            player.draw(); monster.update(); monster.draw();
            return;
        }

        player.update(); player.draw();
        monster.update(); monster.draw(); 
        
        handleObstacles(); 
        handleCoins();
        handleItems();

        frames++;
        requestAnimationFrame(loop);
    }

    images['background'].onload = drawBackground;
</script>
</body>
