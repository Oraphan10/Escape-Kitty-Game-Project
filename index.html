<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner: Escape the Monster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;  /* กว้างเต็ม 100% ของหน้าจอ */
            height: 100vh; /* สูงเต็ม 100% ของหน้าจอ */
            background-color: #e0e0e0;
        }
        canvas {
            display: block;
            width: 100%;   /* สั่งให้ตัวแคนวาสขยายเต็มพื้นที่กรอบ */
            height: 100%;  /* สั่งให้ตัวแคนวาสขยายเต็มพื้นที่กรอบ */
        }
        
        /* ---------------------------------
           ระบบหน้าจอต่างๆ (Screen Management)
           --------------------------------- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* ซ่อนทุกหน้าจอเป็นค่าเริ่มต้น */
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex; /* แสดงเฉพาะหน้าจอที่มีคลาส active */
        }
        
        /* ปุ่มที่เป็นรูปภาพ */
        .img-btn {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .img-btn:hover {
            transform: scale(1.05);
        }
        .img-btn:active {
            transform: scale(0.95);
        }

        /* --- 1. หน้าแรก (Start Screen) --- */
        #start-screen {
            background-image: url('ui-bg-start.png'); 
            background-repeat: no-repeat; /* 1. ห้ามวาดรูปซ้ำ */
            background-size: 100% 100%; /* 2. สั่งให้ภาพปรับขนาดตามสัดส่วนจอ (ขยายภาพให้พอดีจอ) */
            background-position: center; /* 3. จัดให้อยู่กึ่งกลางหน้าจอ */
            background-color: #2c3e50;  /* 4. ใส่สีพื้นหลังไว้ด้านหลังรูป (เผื่อขอบเหลือ) */
        }
        #start-screen.active {
            display: block; /* เปลี่ยนมาใช้ block เพื่อให้กำหนดพิกัดอิสระได้ */
        }
        #btn-mute-start {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px; height: 50px;
        }
        #ui-logo { 
            position: absolute;
            top: -120px; /* ขยับโลโก้ขึ้น (ลดตัวเลขนี้ถ้าอยากให้ชิดขอบบนอีก) */
            left: 50%;
            transform: translateX(-50%); /* จัดกึ่งกลางแนวนอน */
            width: 500px; 
            height: auto;
        }
        #btn-play { 
            position: absolute;
            top: 40%; /* จัดให้อยู่กึ่งกลางแนวตั้งเป๊ะๆ */
            left: 50%; /* จัดให้อยู่กึ่งกลางแนวนอนเป๊ะๆ */
            transform: translate(-50%, -50%);
            width: 120px; 
            height: auto; 
            z-index: 10;
        }
        #ui-howto { 
            position: absolute;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            width: 1000px; /* <--- เพิ่มตัวเลขตรงนี้ (เช่นจากเดิม 450px ลองปรับเป็น 600px หรือ 700px ตามต้องการ) */
            height: 300px; 
        }

        /* --- 2. หน้าเล่นเกม (In-Game UI) --- */
        #game-ui {
            pointer-events: none; /* ให้คลิกทะลุไปที่ Canvas ได้ */
        }
        #game-ui .img-btn { pointer-events: auto; } /* แต่ปุ่มยังกดได้ */
        
        /* มุมซ้ายบน: พลังชีวิต & กรอบเหรียญ */
        #top-left-ui {
            position: absolute;
            top: 0; /* <--- ขยับระยะห่างจากขอบบนจอให้อยู่ในระดับพอดี */
            left: 20px;
        }
        
        #coin-board-container {
            position: relative;
            width: 200px;
            height: 120px;
        }
        #ui-frame-coin {
            position: absolute;
            top: 10px; left: 0; 
            width: 100%; height: 100%;
        }
        #coin-val {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px; /* <--- ขยายขนาดตัวเลขคะแนนให้ใหญ่ขึ้นตามขนาดกรอบ */
            font-weight: bold; color: white;
            text-shadow: 2px 2px 4px black; /* เพิ่มเงาให้ตัวเลขชัดขึ้น */
        }

        /* มุมขวาบน: ปุ่ม Pause */
        #btn-pause {
            position: absolute;
            top: 15px; right: 20px;
            width: 50px; height: 50px;
        }

        /* แจ้งเตือนหนีมอนสเตอร์ (อยู่ตรงกลางหน้าจอส่วนบน) */
        #escape-status {
            position: absolute;
            top: 100px; left: 50%; transform: translateX(-50%);
            color: #e74c3c; font-size: 18px; font-weight: bold;
            background: rgba(255, 255, 255, 0.9); padding: 5px 15px; border-radius: 5px;
            display: none; border: 2px solid #e74c3c;
        }

        /* --- 3. หน้า Popup (Pause & Game Over) --- */
        .popup-screen {
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .popup-box {
            position: relative;
            /* ปรับความกว้าง-สูง ตรงนี้ให้พอดีกับขนาดรูปกรอบที่คุณวาดมาครับ */
            width: 400px; 
            height: 460px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* เพิ่ม 2 บรรทัดนี้ เพื่อบังคับให้เลเยอร์ไม่มุดทะลุฉากดำ */
            z-index: 10; 
            isolation: isolate;
        }
        .popup-bg-frame {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1; /* ให้อยู่หลังปุ่มและข้อความ */
            
            /* เพิ่มบรรทัดนี้ เพื่อกันไม่ให้รูปกรอบผิดสัดส่วน */
            object-fit: fill;
        }
        
        /* ปุ่มในหน้า Pause */
        .pause-buttons { display: flex; gap: 20px; margin-top: 20px; }
        .pause-buttons img { width: 60px; height: 60px; }

        /* ข้อความในหน้า Game Over */
        .gameover-stats {
            font-size: 32px; 
            font-weight: bold; 
            color: white; 
            text-shadow: 2px 2px 4px black;
            margin-bottom: 30px; 
            text-align: center;
            top: 100px
        }
        .gameover-buttons { display: flex; gap: 30px; }
        .gameover-buttons img { width: 80px; height: 80px; }
        
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1050" height="450"></canvas>
    
    <!-- 1. หน้าแรก (Start Screen) -->
    <div id="start-screen" class="screen active">
        <img src="ui-mute.png" id="btn-mute-start" class="img-btn" alt="Mute">
        <img src="ui-logo.png" id="ui-logo" alt="Game Logo">
        
        <!-- รูปปุ่ม Play อยู่ตรงกลางข้างล่าง -->
        <img src="ui-play.png" id="btn-play" class="img-btn" alt="Play Button">
        <!-- รูปกรอบอธิบายการเล่น อยู่ใต้ปุ่ม Play -->
        <img src="ui-howto.png" id="ui-howto" alt="How to Play">
    </div>

    <!-- 2. หน้าเล่นเกม (In-Game UI) -->
    <div id="game-ui" class="screen">
        <div id="top-left-ui">
    
            <!-- กรอบเหรียญอยู่ใต้หัวใจ -->
            <div id="coin-board-container">
                <img src="ui-frame-coin.png" id="ui-frame-coin" alt="Coin Frame">
                <div id="coin-val">0</div>
            </div>
        </div>
        
        <!-- ปุ่ม Pause ขวาบน -->
        <img src="ui-pause.png" id="btn-pause" class="img-btn" alt="Pause">

        <!-- กรอบแจ้งเตือนตอนมอนสเตอร์มา -->
        <div id="escape-status">คิตตี้ตามมาแล้ว เก็บอีก 10 เหรียญ เพื่อหนี: <span id="escape-coins-val">0</span>/10</div>
    </div>

    <!-- 3. หน้าหยุดเกม (Pause Screen) -->
    <div id="pause-screen" class="screen popup-screen">
        <div class="popup-box">
            <img src="ui-frame-pause.png" class="popup-bg-frame" alt="Pause Frame">
            <h2 style="color:white; font-size:36px; margin: 0; text-shadow: 2px 2px 4px black;">PAUSED</h2>
            <div class="pause-buttons">
                <img src="ui-home.png" id="btn-home-pause" class="img-btn" alt="Home">
                <img src="ui-resume.png" id="btn-resume" class="img-btn" alt="Resume">
                <img src="ui-mute.png" id="btn-mute-pause" class="img-btn" alt="Mute">
            </div>
        </div>
    </div>

    <!-- 4. หน้าจบเกม (Game Over Screen) -->
    <div id="game-over-screen" class="screen popup-screen">
        <div class="popup-box">
            <img src="ui-frame-gameover.png" class="popup-bg-frame" alt="Game Over Frame">
            
            <div class="gameover-stats">
                <div id="game-over-title" style="font-size: 20px; color: #ff9f43; margin-bottom: 10px;">GAME OVER</div>
                เหรียญทั้งหมด: <br><span id="final-coins" style="font-size: 48px; color: #f1c40f;">0</span>
            </div>

            <div class="gameover-buttons">
                <img src="ui-home.png" id="btn-home-over" class="img-btn" alt="Home">
                <img src="ui-refresh.png" id="btn-restart" class="img-btn" alt="Refresh">
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ==========================================
     * 1. การตั้งค่าภาพกราฟิกทั้งหมด (ASSETS)
     * ==========================================
     */
    const IMAGE_PATHS = {
        player: 'player.png',
        monster: 'monster.png',
        coin: 'coin.png',
        obstacle: 'obstacle.png',
        background: 'background.png',
        
        // --- กราฟิก UI ---
        btnPlay: 'ui-play.png', btnPause: 'ui-pause.png', btnResume: 'ui-resume.png',
        btnHome: 'ui-home.png', btnRefresh: 'ui-refresh.png', btnMute: 'ui-mute.png',
        logo: 'ui-logo.png', howto: 'ui-howto.png',
        frameCoin: 'ui-frame-coin.png', framePause: 'ui-frame-pause.png', frameGameOver: 'ui-frame-gameover.png',
        
        // --- ไอเท็มและสิ่งกีดขวางใหม่ (ตั้งชื่อไฟล์ตามนี้เลยครับ) ---
        obstacleFlying: 'obstacle-flying.png', // สิ่งกีดขวางบนฟ้า
        itemSpeed: 'item-speed.png',           // ไอเท็มเพิ่มความเร็ว
        itemInvincible: 'item-invincible.png'  // ไอเท็มอมตะทะลุของ
    };

    const images = {};
    for (let key in IMAGE_PATHS) {
        if (!key.startsWith('btn') && !key.startsWith('frame') && !['logo', 'howto'].includes(key)) {
            images[key] = new Image();
            images[key].onerror = () => console.warn(`หาไฟล์ภาพ "${IMAGE_PATHS[key]}" ไม่พบ (ใช้วิธีวาดสีแทน)`);
            images[key].src = IMAGE_PATHS[key];
        }
    }

    function drawSprite(ctx, imgKey, fallbackDraw) {
        const img = images[imgKey];
        if (img && img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, this.x, this.y, this.width, this.height);
        } else {
            fallbackDraw(ctx, this);
        }
    }

    /**
     * ==========================================
     * 2. ระบบควบคุมหน้าจอ และ EVENT LISTENERS
     * ==========================================
     */
    const screens = {
        start: document.getElementById('start-screen'),
        game: document.getElementById('game-ui'),
        pause: document.getElementById('pause-screen'),
        gameOver: document.getElementById('game-over-screen')
    };

    function showScreen(screenName) {
        for (let key in screens) screens[key].classList.remove('active');
        if (screens[screenName]) screens[screenName].classList.add('active');
    }

    let gameState = 'START'; 
    let isMuted = false;

    document.getElementById('btn-play').addEventListener('click', () => initGame());
    document.getElementById('btn-mute-start').addEventListener('click', toggleMute);
    document.getElementById('btn-pause').addEventListener('click', () => { if (gameState === 'PLAYING') pauseGame(); });
    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-home-pause').addEventListener('click', goHome);
    document.getElementById('btn-mute-pause').addEventListener('click', toggleMute);
    document.getElementById('btn-restart').addEventListener('click', () => initGame());
    document.getElementById('btn-home-over').addEventListener('click', goHome);

    function toggleMute() { isMuted = !isMuted; alert(isMuted ? "ปิดเสียง" : "เปิดเสียง"); }
    function pauseGame() { gameState = 'PAUSED'; screens.pause.classList.add('active'); }
    function resumeGame() { gameState = 'PLAYING'; screens.pause.classList.remove('active'); requestAnimationFrame(loop); }
    function goHome() { gameState = 'START'; showScreen('start'); drawBackground(); }

    /**
     * ==========================================
     * 3. การตั้งค่าระบบเกม (GAME SETUP)
     * ==========================================
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GROUND_Y = 400;

    const coinEl = document.getElementById('coin-val');
    const escapeStatusEl = document.getElementById('escape-status');
    const escapeCoinsEl = document.getElementById('escape-coins-val');
    const gameOverTitle = document.getElementById('game-over-title');
    const finalCoinsEl = document.getElementById('final-coins');

    let frames, totalCoins, animationId;
    let isMonsterChasing, coinsCollectedToEscape;
    let player, monster, obstacles, coins, itemsList, bgX;
    
    // ตั้งค่าความเร็วคงที่
    const BASE_SPEED = 6; 

    function initGame() {
        player = new Player();
        monster = new Monster();
        obstacles = [];
        coins = [];
        itemsList = []; // เก็บไอเท็ม
        bgX = 0;
        frames = 0;
        totalCoins = 0;
        isMonsterChasing = false;
        coinsCollectedToEscape = 0;
        
        coinEl.innerText = totalCoins;
        updateEscapeUI();
        
        gameState = 'PLAYING';
        showScreen('game');
        loop();
    }

    /**
     * ==========================================
     * 4. โครงสร้างคลาส (ผู้เล่น, ศัตรู, เหรียญ, ไอเท็ม)
     * ==========================================
     */
    class Player {
        constructor() {
            this.width = 50; this.height = 60;
            this.x = 150; this.y = GROUND_Y - this.height;
            this.vy = 0; this.gravity = 0.6; this.jumpPower = -12;
            this.isGrounded = true; this.maxJumps = 2; this.jumpCount = 0;
            this.invulnerableFrames = 0;
            
            // ตัวนับเวลาไอเท็ม (60 frames = 1 วินาที ดังนั้น 10 วินาที = 600)
            this.speedTimer = 0;
            this.invincibleTimer = 0;
        }
        jump() {
            if (this.jumpCount < this.maxJumps) {
                this.vy = this.jumpPower; this.isGrounded = false; this.jumpCount++;
            }
        }
        update() {
            this.y += this.vy; this.vy += this.gravity;
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height; this.vy = 0; this.isGrounded = true; this.jumpCount = 0;
            }
            if (this.invulnerableFrames > 0) this.invulnerableFrames--;
            if (this.speedTimer > 0) this.speedTimer--;
            if (this.invincibleTimer > 0) this.invincibleTimer--;
        }
        draw() {
            if (this.invulnerableFrames > 0 && Math.floor(this.invulnerableFrames / 5) % 2 === 0) return; 
            
            ctx.save();
            // เอฟเฟกต์เวลาเป็นอมตะ (ตัวโปร่งใส + เรืองแสง)
            if (this.invincibleTimer > 0) {
                ctx.globalAlpha = 0.6; 
                ctx.shadowColor = "yellow";
                ctx.shadowBlur = 20;
            }
            // เอฟเฟกต์เวลาวิ่งเร็ว (ออร่าสีฟ้า)
            if (this.speedTimer > 0) {
                ctx.shadowColor = "cyan";
                ctx.shadowBlur = 15;
            }

            drawSprite.call(this, ctx, 'player', (ctx, obj) => { ctx.fillStyle = '#3498db'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); });
            ctx.restore();
        }
    }

    class Monster {
        constructor() {
            this.width = 90; this.height = 100;
            this.y = GROUND_Y - this.height; this.x = -150; this.targetX = -150; 
        }
        update() {
            this.targetX = isMonsterChasing ? 10 : -150;
            if (gameState === 'GAMEOVER' && isMonsterChasing) this.targetX = player.x;
            this.x += (this.targetX - this.x) * 0.05;
        }
        draw() {
            drawSprite.call(this, ctx, 'monster', (ctx, obj) => {
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                ctx.fillStyle = 'black'; ctx.fillRect(obj.x + 60, obj.y + 20, 10, 10);
            });
        }
    }

    // สิ่งกีดขวางบนพื้น
    class Obstacle {
        constructor() { this.width = 40; this.height = 50; this.x = canvas.width; this.y = GROUND_Y - this.height; }
        update(speed) { this.x -= speed; }
        draw() { drawSprite.call(this, ctx, 'obstacle', (ctx, obj) => { ctx.fillStyle = '#e67e22'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); }); }
    }

    // สิ่งกีดขวางบนฟ้า (ใหม่)
    class FlyingObstacle {
        constructor() { 
            this.width = 50; this.height = 40; 
            this.x = canvas.width; 
            this.y = GROUND_Y - 110 - Math.random() * 40; // สุ่มความสูงให้อยู่ระดับที่กระโดดโดน
        }
        update(speed) { this.x -= speed; }
        draw() { drawSprite.call(this, ctx, 'obstacleFlying', (ctx, obj) => { ctx.fillStyle = '#8e44ad'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); }); }
    }

    class Coin {
        constructor(x, y) { this.width = 30; this.height = 30; this.x = x; this.y = y; this.isCollected = false; }
        update(speed) { this.x -= speed; }
        draw() {
            if (this.isCollected) return;
            drawSprite.call(this, ctx, 'coin', (ctx, obj) => { ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2); ctx.fill(); });
        }
    }

    // ไอเท็มบัฟ (ใหม่)
    class Item {
        constructor(type) {
            this.type = type; // 'speed' หรือ 'invincible'
            this.width = 40; this.height = 40;
            this.x = canvas.width;
            this.y = GROUND_Y - 80 - Math.random() * 50;
            this.isCollected = false;
        }
        update(speed) { this.x -= speed; }
        draw() {
            if (this.isCollected) return;
            let imgKey = this.type === 'speed' ? 'itemSpeed' : 'itemInvincible';
            let colorFallback = this.type === 'speed' ? '#00ffff' : '#ff00ff';
            drawSprite.call(this, ctx, imgKey, (ctx, obj) => { ctx.fillStyle = colorFallback; ctx.beginPath(); ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2); ctx.fill(); });
        }
    }

    /**
     * ==========================================
     * 5. ระบบคำนวณและการตรวจสอบชน
     * ==========================================
     */
    function updateEscapeUI() {
        if (isMonsterChasing) { escapeStatusEl.style.display = 'block'; escapeCoinsEl.innerText = coinsCollectedToEscape; } 
        else { escapeStatusEl.style.display = 'none'; }
    }

    function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (gameState === 'PLAYING') player.jump();
    }
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('mousedown', handleInput);

    function checkCollision(rect1, rect2) {
        return (rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y);
    }

    function handleObstacles(currentSpeed) {
        // สุ่มเกิดสิ่งกีดขวาง (มีโอกาสเกิดเป็นบนพื้น 70% บนฟ้า 30%)
        if (frames % 100 === 0 || (frames > 0 && Math.random() < 0.005 && frames % 50 === 0)) {
            if (Math.random() > 0.3) obstacles.push(new Obstacle());
            else obstacles.push(new FlyingObstacle());
        }

        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i]; obs.update(currentSpeed); obs.draw();
            let pBox = { x: player.x + 10, y: player.y + 10, width: player.width - 20, height: player.height - 10 };
            let oBox = { x: obs.x + 5, y: obs.y + 5, width: obs.width - 10, height: obs.height - 10 };

            if (checkCollision(pBox, oBox) && player.invulnerableFrames <= 0) {
                // เช็คว่ามีไอเท็มอมตะอยู่หรือไม่ ถ้ามี ให้ทะลุไปเลย ไม่โดนดาเมจ!
                if (player.invincibleTimer > 0) {
                    // ไม่ทำอะไร ปล่อยทะลุ
                } else {
                    player.invulnerableFrames = 60;
                    if (isMonsterChasing) doGameOver("ถูกมอนสเตอร์จับตัวได้!");
                    else { isMonsterChasing = true; coinsCollectedToEscape = 0; updateEscapeUI(); }
                }
            }
            if (obs.x + obs.width < 0) { obstacles.splice(i, 1); i--; }
        }
    }

    function handleCoins(currentSpeed) {
        // เปลี่ยนระบบสุ่มเหรียญให้เป็นแบบกลุ่ม
        if (frames % 120 === 0) {
            let r = Math.random();
            let startY = GROUND_Y - 80 - Math.random() * 60;
            
            if (r < 0.3) {
                // แบบที่ 1: เหรียญเดี่ยว 1 เหรียญ (30%)
                coins.push(new Coin(canvas.width, startY)); 
            } else if (r < 0.7) {
                // แบบที่ 2: เหรียญเรียงกัน 3 เหรียญ (40%)
                coins.push(new Coin(canvas.width, startY));
                coins.push(new Coin(canvas.width + 40, startY));
                coins.push(new Coin(canvas.width + 80, startY));
            } else {
                // แบบที่ 3: เหรียญโค้งเป็นซุ้ม 5 เหรียญ (30%)
                coins.push(new Coin(canvas.width, startY));
                coins.push(new Coin(canvas.width + 40, startY - 30));
                coins.push(new Coin(canvas.width + 80, startY - 60));
                coins.push(new Coin(canvas.width + 120, startY - 30));
                coins.push(new Coin(canvas.width + 160, startY));
            }
        }

        for (let i = 0; i < coins.length; i++) {
            let coin = coins[i]; coin.update(currentSpeed); coin.draw();
            if (!coin.isCollected && checkCollision(player, coin)) {
                coin.isCollected = true;
                totalCoins++; 
                coinEl.innerText = totalCoins;

                if (isMonsterChasing) {
                    coinsCollectedToEscape++; updateEscapeUI();
                    if (coinsCollectedToEscape >= 10) { isMonsterChasing = false; updateEscapeUI(); }
                }
            }
            if (coin.x + coin.width < 0 || coin.isCollected) { coins.splice(i, 1); i--; }
        }
    }

    function handleItems(currentSpeed) {
        // สุ่มเกิดไอเท็มทุกๆ ประมาณ 10 วินาที
        if (frames > 0 && frames % 600 === 0) {
            let type = Math.random() > 0.5 ? 'speed' : 'invincible';
            itemsList.push(new Item(type));
        }

        for (let i = 0; i < itemsList.length; i++) {
            let item = itemsList[i]; item.update(currentSpeed); item.draw();
            if (!item.isCollected && checkCollision(player, item)) {
                item.isCollected = true;
                // ให้ผลลัพธ์นาน 10 วินาที (600 frames)
                if (item.type === 'speed') player.speedTimer = 600; 
                else player.invincibleTimer = 600; 
            }
            if (item.x + item.width < 0 || item.isCollected) { itemsList.splice(i, 1); i--; }
        }
    }

    function drawBackground(currentSpeed = 0) {
        const bgImg = images['background'];
        if (bgImg && bgImg.complete && bgImg.naturalWidth !== 0) {
            if (gameState === 'PLAYING') bgX -= currentSpeed * 0.5; // ฉากเลื่อนเร็วขึ้นตามความเร็วปัจจุบัน
            if (bgX <= -canvas.width) bgX = 0;
            ctx.drawImage(bgImg, bgX, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, bgX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        }
    }

    function doGameOver(reason) {
        gameState = 'GAMEOVER';
        gameOverTitle.innerText = reason;
        finalCoinsEl.innerText = totalCoins; 
        setTimeout(() => { screens.gameOver.classList.add('active'); }, 800); 
    }

    function loop() {
        if (gameState !== 'PLAYING' && gameState !== 'GAMEOVER') return; 

        // 1. คำนวณความเร็ว (ความเร็วปกติ + โบนัสความเร็ว 4 หน่วยถ้าเก็บไอเท็มได้)
        let currentSpeed = BASE_SPEED + (player.speedTimer > 0 ? 4 : 0);

        // 2. วาดฉากหลังที่เคลื่อนที่ตามความเร็วปัจจุบัน
        drawBackground(currentSpeed);

        if (gameState === 'GAMEOVER') {
            player.draw(); monster.update(); monster.draw();
            return;
        }

        // 3. อัปเดตเอนทิตีทั้งหมดโดยใช้ currentSpeed
        player.update(); player.draw();
        monster.update(); monster.draw(); 
        handleObstacles(currentSpeed); 
        handleCoins(currentSpeed);
        handleItems(currentSpeed);

        frames++;
        requestAnimationFrame(loop);
    }

    images['background'].onload = () => drawBackground(0);

</script>
</body>
</html>
