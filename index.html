<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner: Escape the Monster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: #e0e0e0;
        }
        canvas {
            display: block;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
        
        .img-btn {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .img-btn:hover {
            transform: scale(1.05);
        }
        .img-btn:active {
            transform: scale(0.95);
        }

        #start-screen {
            background-image: url('ui-bg-start.png');
            justify-content: flex-start;
            padding-top: 40px;
            background-color: #2c3e50;
        }
        #start-screen.active {
            display: block;
        }
        #btn-mute-start {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px; height: 50px;
        }
        #ui-logo { 
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px; 
            height: auto;
        }
        #btn-play { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; 
            height: auto; 
            z-index: 10;
        }
        #ui-howto { 
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px; 
            height: 50px; 
        }

        #game-ui {
            pointer-events: none;
        }
        #game-ui .img-btn { pointer-events: auto; }
        
        #top-left-ui {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #health-board { display: flex; gap: 5px; }
        #health-board img { width: 30px; height: 30px; }
        
        #coin-board-container {
            position: relative;
            width: 150px;
            height: 50px;
        }
        #ui-frame-coin {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        #coin-val {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; color: white;
            text-shadow: 1px 1px 3px black;
        }

        #btn-pause {
            position: absolute;
            top: 15px; right: 20px;
            width: 50px; height: 50px;
        }

        #escape-status {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            color: #e74c3c; font-size: 18px; font-weight: bold;
            background: rgba(255, 255, 255, 0.9); padding: 5px 15px; border-radius: 5px;
            display: none; border: 2px solid #e74c3c;
        }

        .popup-screen {
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .popup-box {
            position: relative;
            width: 400px; height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .popup-bg-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
        
        .pause-buttons { display: flex; gap: 20px; margin-top: 20px; }
        .pause-buttons img { width: 60px; height: 60px; }

        .gameover-stats {
            font-size: 32px; font-weight: bold; color: white; text-shadow: 2px 2px 4px black;
            margin-bottom: 30px; text-align: center;
        }
        .gameover-buttons { display: flex; gap: 30px; }
        .gameover-buttons img { width: 80px; height: 80px; }

        /* ตัวเลขแสดงการนับถอยหลัง */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            z-index: 100;
            pointer-events: none;
        }
        #countdown-text {
            font-size: 120px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8), 0 0 20px #e67e22;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="480"></canvas>
    
    <!-- 1. หน้าแรก (Start Screen) -->
    <div id="start-screen" class="screen active">
        <img src="ui-mute.png" id="btn-mute-start" class="img-btn" alt="Mute">
        <img src="ui-logo.png" id="ui-logo" alt="Game Logo">
        <img src="ui-play.png" id="btn-play" class="img-btn" alt="Play Button">
        <img src="ui-howto.png" id="ui-howto" alt="How to Play">
    </div>

    <!-- 2. หน้าเล่นเกม (In-Game UI) -->
    <div id="game-ui" class="screen">
        <div id="top-left-ui">
            <div id="health-board">
                <img src="hearth1.png" id="life-1" alt="life">
                <img src="hearth2.png" id="life-2" alt="life">
                <img src="hearth3.png" id="life-3" alt="life">
            </div>
            <div id="coin-board-container">
                <img src="ui-frame-coin.png" id="ui-frame-coin" alt="Coin Frame">
                <div id="coin-val">0</div>
            </div>
        </div>
        
        <img src="ui-pause.png" id="btn-pause" class="img-btn" alt="Pause">
        <div id="escape-status">หนี! เก็บเหรียญ: <span id="escape-coins-val">0</span>/10</div>
    </div>

    <!-- 3. หน้าหยุดเกม (Pause Screen) -->
    <div id="pause-screen" class="screen popup-screen">
        <div class="popup-box">
            <img src="ui-frame-pause.png" class="popup-bg-frame" alt="Pause Frame">
            <h2 style="color:white; font-size:36px; margin: 0; text-shadow: 2px 2px 4px black;">PAUSED</h2>
            <div class="pause-buttons">
                <img src="ui-home.png" id="btn-home-pause" class="img-btn" alt="Home">
                <img src="ui-resume.png" id="btn-resume" class="img-btn" alt="Resume">
                <img src="ui-mute.png" id="btn-mute-pause" class="img-btn" alt="Mute">
            </div>
        </div>
    </div>

    <!-- 4. หน้าจบเกม (Game Over Screen) -->
    <div id="game-over-screen" class="screen popup-screen">
        <div class="popup-box">
            <img src="ui-frame-gameover.png" class="popup-bg-frame" alt="Game Over Frame">
            <div class="gameover-stats">
                <div id="game-over-title" style="font-size: 20px; color: #ff9f43; margin-bottom: 10px;">GAME OVER</div>
                เหรียญทั้งหมด: <br><span id="final-coins" style="font-size: 48px; color: #f1c40f;">0</span>
            </div>
            <div class="gameover-buttons">
                <img src="ui-home.png" id="btn-home-over" class="img-btn" alt="Home">
                <img src="ui-refresh.png" id="btn-restart" class="img-btn" alt="Refresh">
            </div>
        </div>
    </div>

    <!-- 5. Overlay สำหรับแสดงนับถอยหลัง -->
    <div id="countdown-overlay">
        <div id="countdown-text">3</div>
    </div>
</div>

<script>
    const IMAGE_PATHS = {
        player: 'player.png',
        monster: 'monster.png',
        coin: 'coin.png',
        obstacle: 'obstacle.png',
        background: 'background.png',
        
        btnPlay: 'ui-play.png',
        btnPause: 'ui-pause.png',
        btnResume: 'ui-resume.png',
        btnHome: 'ui-home.png',
        btnRefresh: 'ui-refresh.png',
        btnMute: 'ui-mute.png',
        
        logo: 'ui-logo.png',
        howto: 'ui-howto.png',
        heart: 'ui-heart.png',
        frameCoin: 'ui-frame-coin.png',
        framePause: 'ui-frame-pause.png',
        frameGameOver: 'ui-frame-gameover.png'
    };

    const images = {};
    for (let key in IMAGE_PATHS) {
        if (['player', 'monster', 'coin', 'obstacle', 'background'].includes(key)) {
            images[key] = new Image();
            images[key].onerror = () => console.warn(`หาไฟล์ภาพ "${IMAGE_PATHS[key]}" ไม่พบ`);
            images[key].src = IMAGE_PATHS[key];
        }
    }

    function drawSprite(ctx, imgKey, fallbackDraw) {
        const img = images[imgKey];
        if (img && img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, this.x, this.y, this.width, this.height);
        } else {
            fallbackDraw(ctx, this);
        }
    }

    const screens = {
        start: document.getElementById('start-screen'),
        game: document.getElementById('game-ui'),
        pause: document.getElementById('pause-screen'),
        gameOver: document.getElementById('game-over-screen')
    };

    function showScreen(screenName) {
        for (let key in screens) screens[key].classList.remove('active');
        if (screens[screenName]) screens[screenName].classList.add('active');
    }

    let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'COUNTDOWN', 'GAMEOVER'
    let isMuted = false;

    document.getElementById('btn-play').addEventListener('click', () => { initGame(); });
    document.getElementById('btn-mute-start').addEventListener('click', toggleMute);
    document.getElementById('btn-pause').addEventListener('click', () => {
        if (gameState === 'PLAYING') pauseGame();
    });

    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-home-pause').addEventListener('click', goHome);
    document.getElementById('btn-mute-pause').addEventListener('click', toggleMute);
    document.getElementById('btn-restart').addEventListener('click', () => { initGame(); });
    document.getElementById('btn-home-over').addEventListener('click', goHome);

    function toggleMute() {
        isMuted = !isMuted;
        alert(isMuted ? "ปิดเสียงแล้ว" : "เปิดเสียงแล้ว");
    }

    function pauseGame() {
        gameState = 'PAUSED';
        screens.pause.classList.add('active');
    }

    function resumeGame() {
        screens.pause.classList.remove('active');
        
        startCountdown(3, () => {
            gameState = 'PLAYING';
            requestAnimationFrame(loop);
        });
    }

    function startCountdown(seconds, callback) {
        gameState = 'COUNTDOWN';
        let count = seconds;
        
        countdownText.innerText = count;
        countdownOverlay.style.display = 'flex';

        countdownText.style.animation = 'none';
        countdownText.offsetHeight;
        countdownText.style.animation = 'popIn 0.3s ease-out';

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countdownText.innerText = count;
                countdownText.style.animation = 'none';
                countdownText.offsetHeight;
                countdownText.style.animation = 'popIn 0.3s ease-out';
            } else if (count === 0) {
                countdownText.innerText = 'GO!';
                countdownText.style.animation = 'none';
                countdownText.offsetHeight;
                countdownText.style.animation = 'popIn 0.3s ease-out';
            } else {
                clearInterval(timer);
                countdownOverlay.style.display = 'none';
                callback();
            }
        }, 800);
    }

    function goHome() {
        gameState = 'START';
        showScreen('start');
        drawBackground();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GROUND_Y = 400;

    const coinEl = document.getElementById('coin-val');
    const escapeStatusEl = document.getElementById('escape-status');
    const escapeCoinsEl = document.getElementById('escape-coins-val');
    const gameOverTitle = document.getElementById('game-over-title');
    const finalCoinsEl = document.getElementById('final-coins');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownText = document.getElementById('countdown-text');

    let frames, totalCoins, gameSpeed;
    let lives, isMonsterChasing, coinsCollectedToEscape;
    let player, monster, obstacles, coins, bgX;

    function initGame() {
        player = new Player();
        monster = new Monster();
        obstacles = [];
        coins = [];
        bgX = 0;
        
        frames = 0;
        totalCoins = 0;
        gameSpeed = 5;
        
        lives = 3;
        isMonsterChasing = false;
        coinsCollectedToEscape = 0;
        
        coinEl.innerText = totalCoins;
        updateLivesUI();
        updateEscapeUI();
        
        gameState = 'PLAYING';
        showScreen('game');
        
        loop();
    }

    class Player {
        constructor() {
            this.width = 50; this.height = 60;
            this.x = 150; this.y = GROUND_Y - this.height;
            this.vy = 0; this.gravity = 0.6; this.jumpPower = -12;
            this.isGrounded = true; this.maxJumps = 2; this.jumpCount = 0;
            this.invulnerableFrames = 0;
        }
        jump() {
            if (this.jumpCount < this.maxJumps) {
                this.vy = this.jumpPower; this.isGrounded = false; this.jumpCount++;
            }
        }
        update() {
            this.y += this.vy; this.vy += this.gravity;
            if (this.y + this.height >= GROUND_Y) {
                this.y = GROUND_Y - this.height; this.vy = 0; this.isGrounded = true; this.jumpCount = 0;
            }
            if (this.invulnerableFrames > 0) this.invulnerableFrames--;
        }
        draw() {
            if (this.invulnerableFrames > 0 && Math.floor(this.invulnerableFrames / 5) % 2 === 0) return; 
            drawSprite.call(this, ctx, 'player', (ctx, obj) => { ctx.fillStyle = '#3498db'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); });
        }
    }

    class Monster {
        constructor() {
            this.width = 90; this.height = 100;
            this.y = GROUND_Y - this.height; this.x = -150; this.targetX = -150; 
        }
        update() {
            this.targetX = isMonsterChasing ? 10 : -150;
            if (gameState === 'GAMEOVER' && isMonsterChasing) this.targetX = player.x;
            this.x += (this.targetX - this.x) * 0.05;
        }
        draw() {
            drawSprite.call(this, ctx, 'monster', (ctx, obj) => {
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                ctx.fillStyle = 'black'; ctx.fillRect(obj.x + 60, obj.y + 20, 10, 10);
            });
        }
    }

    class Obstacle {
        constructor() { this.width = 40; this.height = 50; this.x = canvas.width; this.y = GROUND_Y - this.height; }
        update() { this.x -= gameSpeed; }
        draw() { drawSprite.call(this, ctx, 'obstacle', (ctx, obj) => { ctx.fillStyle = '#e67e22'; ctx.fillRect(obj.x, obj.y, obj.width, obj.height); }); }
    }

    class Coin {
        constructor() { this.width = 30; this.height = 30; this.x = canvas.width; this.y = GROUND_Y - 120 - Math.random() * 60; this.isCollected = false; }
        update() { this.x -= gameSpeed; }
        draw() {
            if (this.isCollected) return;
            drawSprite.call(this, ctx, 'coin', (ctx, obj) => { ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2); ctx.fill(); });
        }
    }

    function updateLivesUI() {
        for (let i = 1; i <= 3; i++) {
            document.getElementById(`life-${i}`).style.display = (i <= lives) ? 'block' : 'none';
        }
    }

    function updateEscapeUI() {
        if (isMonsterChasing) {
            escapeStatusEl.style.display = 'block';
            escapeCoinsEl.innerText = coinsCollectedToEscape;
        } else {
            escapeStatusEl.style.display = 'none';
        }
    }

    function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (gameState === 'PLAYING') player.jump();
    }
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('mousedown', handleInput);

    function checkCollision(rect1, rect2) {
        return (rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y);
    }

    function handleObstacles() {
        if (frames % 120 === 0 || (frames > 0 && Math.random() < 0.005 && frames % 60 === 0)) obstacles.push(new Obstacle());
        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i]; obs.update(); obs.draw();
            let pBox = { x: player.x + 10, y: player.y + 10, width: player.width - 20, height: player.height - 10 };
            let oBox = { x: obs.x + 5, y: obs.y + 5, width: obs.width - 10, height: obs.height - 10 };

            if (checkCollision(pBox, oBox) && player.invulnerableFrames <= 0) {
                lives--; updateLivesUI(); player.invulnerableFrames = 60;
                
                if (isMonsterChasing) doGameOver("ถูกมอนสเตอร์จับตัวได้!");
                else if (lives <= 0) doGameOver("พลังชีวิตหมด!");
                else { isMonsterChasing = true; coinsCollectedToEscape = 0; updateEscapeUI(); }
            }
            if (obs.x + obs.width < 0) { obstacles.splice(i, 1); i--; }
        }
    }

    function handleCoins() {
        if (frames % 90 === 0) coins.push(new Coin());
        for (let i = 0; i < coins.length; i++) {
            let coin = coins[i]; coin.update(); coin.draw();
            if (!coin.isCollected && checkCollision(player, coin)) {
                coin.isCollected = true;
                totalCoins++;
                coinEl.innerText = totalCoins;

                if (isMonsterChasing) {
                    coinsCollectedToEscape++; updateEscapeUI();
                    if (coinsCollectedToEscape >= 10) { isMonsterChasing = false; updateEscapeUI(); }
                }
            }
            if (coin.x + coin.width < 0 || coin.isCollected) { coins.splice(i, 1); i--; }
        }
    }

    function drawBackground() {
        const bgImg = images['background'];
        if (bgImg && bgImg.complete && bgImg.naturalWidth !== 0) {
            if (gameState === 'PLAYING') bgX -= gameSpeed * 0.5;
            if (bgX <= -canvas.width) bgX = 0;
            ctx.drawImage(bgImg, bgX, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, bgX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        }
    }

    function doGameOver(reason) {
        gameState = 'GAMEOVER';
        gameOverTitle.innerText = reason;
        finalCoinsEl.innerText = totalCoins;
        
        setTimeout(() => {
            screens.gameOver.classList.add('active');
        }, 800); 
    }

    function loop() {
        if (gameState !== 'PLAYING' && gameState !== 'GAMEOVER') return;

        drawBackground();

        if (gameState === 'GAMEOVER') {
            player.draw(); monster.update(); monster.draw();
            return;
        }

        player.update(); player.draw();
        monster.update(); monster.draw(); 
        handleObstacles(); handleCoins();

        if (frames % 60 === 0 && frames !== 0 && gameSpeed < 12) gameSpeed += 0.05;
        
        frames++;
        requestAnimationFrame(loop);
    }

    images['background'].onload = drawBackground;
</script>
</body>
</html>
